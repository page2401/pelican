name: Deploy Pelican to page branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-pelican
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install exact pinned Python dependencies
        run: pip install -r requirements.txt

      - name: Build static site with Pelican
        run: |
          pelican content -o output -s pelicanconf.py
          touch output/.nojekyll

      - name: Publish static output to orphan page branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          publish_branch: page
          force_orphan: true
          commit_message: "deploy(page): build from ${{ github.sha }}"
